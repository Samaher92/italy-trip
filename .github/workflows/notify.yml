name: Italy hype notifications

on:
  schedule:
    - cron: '0 6 * * *'   # every day 06:00 UTC = 09:00 Saudi time
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification now'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - name: Send
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node notify/send.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && '--test' || '' }} | tee notify/last-run.txt
      # GitHub pauses scheduled jobs after 60 quiet days; a tiny log commit on send days keeps this one alive
      - name: Keep the schedule alive
        run: |
          if grep -q "sent" notify/last-run.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add notify/last-run.txt
            git commit -m "notify: $(cat notify/last-run.txt)" || true
            git push || true
          fi

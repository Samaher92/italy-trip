<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عداد الرحلة · إيطاليا ✈️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2D38;--muted:#5E6B73;--bg:#F7F4FB;--card:#fff;--sky:#8EC5E8;--lav:#C9B8E8;--peach:#F4B896;--olive:#A8B68A;--sand:#E8D5B0;--red:#B3382D;--green:#3F7A52;--line:#ECE7F2}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,sans-serif;color:var(--ink);min-height:100vh;background-color:#FFF7F1}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:url("images/italy-pattern.jpg") center/520px auto repeat;opacity:.22;pointer-events:none}
.app{max-width:440px;margin:0 auto;padding:14px 16px 120px;display:flex;flex-direction:column;gap:14px}
@media(min-width:900px){.app{max-width:1080px;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.app>.hero,.app>.top{grid-column:1/-1}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.avatars{display:flex}
.av{width:36px;height:36px;border-radius:50%;border:3px solid #fff;margin-inline-start:-10px;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--ink)}
.av:first-child{margin-inline-start:0}
.card{background:var(--card);border-radius:30px;padding:18px;box-shadow:0 10px 26px rgba(120,90,80,.08);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(120,90,80,.12)}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:20px;background:linear-gradient(180deg,#F9C7CF 0%,#FFF0E6 85%);box-shadow:0 12px 30px rgba(230,120,140,.18)}
.hero .scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;pointer-events:none}
.hero .inner{position:relative}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;box-shadow:0 4px 12px rgba(60,40,100,.08)}
.hero h1{margin:14px 0 0;font-size:36px;font-weight:800;line-height:1.1}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.cd div{background:rgba(255,255,255,.8);border-radius:18px;padding:10px 4px;text-align:center}
.cd b{display:block;font-size:24px;font-weight:800}
.cd span{font-size:13px;color:var(--muted)}
.share{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#BDE7D6,#C9D7F7);color:var(--ink);border-radius:30px;padding:20px;box-shadow:0 10px 26px rgba(90,150,130,.2)}
.share strong{font-size:34px;font-weight:800;display:block}
.share small{font-size:15px;opacity:.9}
.mini{background:rgba(255,255,255,.7);border-radius:18px;padding:10px 12px;text-align:center;min-width:92px}
.mini b{display:block;font-size:17px}
.mini span{font-size:13px;color:var(--muted)}
.alert{border-radius:20px;padding:14px 16px;background:#FDECEA;border:1px solid #F3C9C4;color:var(--red);font-weight:700}
h2{margin:0 0 12px;font-size:19px;font-weight:800}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:#EFEAF6;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sky),var(--lav));transition:width .8s cubic-bezier(.2,.7,.2,1)}
.btn{border:0;border-radius:999px;min-height:48px;padding:0 20px;font:800 16px Tajawal,sans-serif;color:var(--ink);background:#fff;cursor:pointer;transition:transform .15s,box-shadow .2s,background .3s;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,#F9C7CF,#F7D6A6)}
.btn.ink{background:var(--ink);color:#fff}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.in,.sel{height:50px;border:1px solid var(--line);border-radius:999px;padding:0 16px;font:600 16px Tajawal,sans-serif;background:#FBFAFD;color:var(--ink);width:100%;min-width:0}
.ta{border:1px solid var(--line);border-radius:18px;padding:12px 16px;font:600 16px Tajawal,sans-serif;background:#FBFAFD;width:100%;min-height:72px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font:600 15px Tajawal,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exp{display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:14px 12px 14px 14px;border-right:8px solid var(--c,#ccc);box-shadow:0 4px 14px rgba(60,40,100,.05)}
.del{width:44px;height:44px;border:0;border-radius:50%;background:#FDECEA;cursor:pointer;font-size:18px}
.empty{border:1.5px dashed #CFC6DB;border-radius:24px;padding:26px 18px;text-align:center;background:#fff}
.ck{display:flex;align-items:center;gap:12px;min-height:54px;font-size:17px;font-weight:700;cursor:pointer}
.ck input{width:24px;height:24px;accent-color:#7FB98F}
.ring{position:relative;width:118px;height:118px;border-radius:50%;flex:0 0 118px}
.ring div{position:absolute;inset:14px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.tl{position:relative;margin-right:20px;padding-right:34px}
.tl::before{content:"";position:absolute;top:10px;bottom:10px;right:14px;border-right:3px dashed #B9AFA0}
.stop{position:relative;background:#fff;border-radius:22px;padding:14px 16px;border-right:6px solid var(--c);box-shadow:0 6px 18px rgba(60,40,100,.06);margin-bottom:12px}
.stop::before{content:"";position:absolute;right:-30px;top:20px;width:20px;height:20px;border-radius:50%;background:var(--c);border:4px solid var(--bg)}
.stop.now{outline:3px solid var(--c);outline-offset:2px}
.tip{background:linear-gradient(135deg,#D9F2E6,#FDE3D0);border-radius:30px;padding:18px;display:flex;gap:14px;align-items:center}
.tipIcon{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px;flex:0 0 52px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.city{border-radius:24px;padding:16px;background:#fff;border-right:7px solid var(--c);box-shadow:0 6px 18px rgba(60,40,100,.06);margin-bottom:16px;position:relative}
.city h3{margin:0;font-size:22px;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{font-size:14px;border-radius:999px;padding:6px 12px;background:#F4F1F9;color:var(--ink)}
.dot{position:absolute;right:-47px;top:20px;width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--c);display:grid;place-items:center;font-size:17px}
.navwrap{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:9}
.nav{pointer-events:auto;display:flex;gap:4px;background:linear-gradient(90deg,#B9E6D4,#F9C7A8);border-radius:999px;padding:6px;box-shadow:0 12px 28px rgba(120,90,80,.25);width:min(440px,calc(100% - 28px))}
.nav button{flex:1;min-height:52px;border:0;border-radius:999px;background:transparent;color:#4D5A62;font:700 13px Tajawal,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:background .35s,color .35s,transform .15s}
.nav button:active{transform:scale(.95)}
.nav button[aria-current=page]{background:#fff;color:var(--ink);box-shadow:0 4px 10px rgba(0,0,0,.1)}
.nav .i{font-size:19px}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app" id="app" aria-live="polite"></div>
<nav class="navwrap" aria-label="التبويبات"><div class="nav" id="nav"></div></nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ===== إعدادات Firebase (مشروع italy-trip-26842) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBLuVCMU-Wq_t6S8QRabRlm8JHCg-0mX7Y",
  authDomain: "italy-trip-26842.firebaseapp.com",
  projectId: "italy-trip-26842",
  storageBucket: "italy-trip-26842.firebasestorage.app",
  messagingSenderId: "845872201564",
  appId: "1:845872201564:web:5a762d6f7f7e1c36e8cb99",
  measurementId: "G-RE6TTB0FDN"
};
const OWNER_EMAIL = "d.a.samaher@gmail.com";

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const fdb = getFirestore(fbApp);

/* ===== بيانات افتراضية ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmt0 = n => Number(n || 0).toLocaleString('en-US', {maximumFractionDigits: 0});
const sum = a => a.reduce((s, x) => s + Number(x.amount || 0), 0);
const uid = () => Math.random().toString(36).slice(2, 9);
const TAKEOFF = Date.parse('2027-04-17T14:05:00+03:00');
const CATS = ['هدايا','تسوق شخصي','أكل وشرب','قهوة وحلويات','مواصلات محلية','تذاكر ومتاحف','متفرقات'];
const CAT_COLOR = {'هدايا':'#F4C7D6','تسوق شخصي':'#E8D5B0','أكل وشرب':'#F4B896','قهوة وحلويات':'#A8B68A','مواصلات محلية':'#B8D8C8','تذاكر ومتاحف':'#C9B8E8','متفرقات':'#D9D4E0'};
const AV_COLORS = ['#BFDDF0','#F8D9B8','#D8CBF2','#C6E3CF','#F7C9D0','#F2E4A8'];
const DEFAULT_PLAN = {
  travelers: 5,
  cities: [
    {id:'milan', name:'ميلانو', color:'#5B9BD5', dates:'١٧ – ٢٠ أبريل · ٣ ليالي', desc:'Easylife Cannobio 12 Duomo · Airbnb', items:[{id:'m1', kind:'site', text:'زيارة الدومو · ١٨ أبريل'}]},
    {id:'bologna', name:'بولونيا', color:'#D9645A', dates:'٢٠ – ٢٣ أبريل · ٣ ليالي', desc:'ImmoBo Panorama · Booking', items:[]},
    {id:'florence', name:'فلورنسا', color:'#D9A93A', dates:'٢٣ – ٢٥ أبريل · ليلتين', desc:'Art Apartment Luxury Sofia Suite · Booking', items:[]},
    {id:'rome', name:'روما', color:'#E8844A', dates:'٢٥ – ٢٩ أبريل · ٤ ليالي', desc:'شقة صبينا، حي مونتي قرب الكولوسيوم · Airbnb', items:[]}
  ],
  currentCity: null,
  updates: []
};
const TIP_SVG = {};
const DEFAULT_TIPS = [
  {city:'ميلانو', icon:'🍚', text:'جربي الريزوتو ألا ميلانيزي، الطبق الأشهر في المدينة.'},
  {city:'ميلانو', icon:'🎨', text:'زوري دير سانتا ماريا ديلي غراتسي، فيه لوحة العشاء الأخير، والحجز لازم يكون مسبق.'},
  {city:'بولونيا', icon:'🍝', text:'ذوقي التالياتيلي بالراغو، والمدينة مشهورة فيه.'},
  {city:'بولونيا', icon:'🏛️', text:'امشي في الأروقة المغطاة حول بيازا ماجوري بعد العصر.'},
  {city:'فلورنسا', icon:'🥩', text:'جربي البيستيكا فيورنتينا، ستيك على الفحم.'},
  {city:'فلورنسا', icon:'⛪', text:'اطلعي على قبة الدومو، والحجز يكون وقت مسبق.'},
  {city:'روما', icon:'🍝', text:'جربي الكاسيو إي بيبي، باستا بالجبن والفلفل الأسود.'},
  {city:'روما', icon:'⛲', text:'زوري حي ترستيفيري في المساء، وتوقفي عند نافورة تريفي.'},
  {city:'إيطاليا', icon:'☕', text:'الكابتشينو بعد الظهر ما يشربونه الإيطاليين، اطلبيه الصبح بس.'}
];
const DEFAULT_BUDGET = {
  total: 41620,
  lines: [
    {id:'h-milan', group:'housing', label:'سكن ميلانو', amount:5316.69, paid:true},
    {id:'h-bologna', group:'housing', label:'سكن بولونيا', amount:6110, paid:false},
    {id:'h-florence', group:'housing', label:'سكن فلورنسا', amount:3395.14, paid:false},
    {id:'h-rome', group:'housing', label:'سكن روما', amount:8504.60, paid:false},
    {id:'t-return', group:'tickets', label:'طيران العودة روما ← جدة', amount:0, paid:false}
  ]
};
const DEFAULT_BAG = ['جواز السفر','تذاكر الطيران','إثبات التأشيرة (نسخة مطبوعة)','بطاقات بنكية + شيء من اليورو','محوّل كهرباء إيطالي','أدوية شخصية','حذاء مريح للمشي','شاحن جوال + بطارية متنقلة'];

/* ===== الحالة ===== */
let user = null, me = null, isOwner = false, ready = false;
let plan = structuredClone(DEFAULT_PLAN), budget = structuredClone(DEFAULT_BUDGET);
let members = {}, tab = 'home', catFilter = 'الكل', tipIdx = 0;

function nameOf(id){ return (members[id] && members[id].name) || (id === me ? 'أنتِ' : 'عضو'); }
function initial(id){ return (nameOf(id) || '؟').trim().charAt(0); }
function colorOf(id){ let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AV_COLORS[h % AV_COLORS.length]; }
function avatarStack(ids){
  return '<div class="avatars">' + ids.slice(0, 5).map(id => `<div class="av" style="background:${colorOf(id)}" title="${esc(nameOf(id))}">${esc(initial(id))}</div>`).join('') + '</div>';
}
function calc(){
  const lines = budget.lines || [];
  const committed = sum(lines);
  const paid = sum(lines.filter(l => l.paid));
  const unpaid = committed - paid;
  const spent = sum(Object.values(members).flatMap(m => m.expenses || []));
  const pool = Object.values(members).reduce((s, m) => s + Number(m.contributed || 0), 0);
  const available = Number(budget.total || 0) - spent - committed;
  const share = Number(budget.total || 0) / Math.max(1, Number(plan.travelers || 5));
  return {committed, paid, unpaid, spent, pool, available, share};
}
function mine(){ return (me && members[me]) || {name: '', contributed: 0, expenses: [], bag: []}; }

/* ===== الكتابة على Firestore ===== */
async function saveBudget(){ if (isOwner) { try { await setDoc(doc(fdb, 'trip', 'budget'), budget); } catch(e) { alert('ما انحفظ: ' + e.message); } } render(); }
async function savePlan(){ if (isOwner) { try { await setDoc(doc(fdb, 'trip', 'plan'), plan); } catch(e) { alert('ما انحفظ: ' + e.message); } } render(); }
async function saveMine(patch){
  if (!me) return;
  const next = {...mine(), ...patch, name: mine().name || ''};
  members[me] = next; render();
  try { await setDoc(doc(fdb, 'members', me), next, {merge: true}); } catch(e) { alert('ما انحفظ: ' + e.message); }
}

/* ===== الدخول ===== */
async function ensureSignedIn(){
  if (auth.currentUser) return;
  try { await signInAnonymously(auth); } catch(e) { console.error(e); }
}
async function ownerLogin(){
  try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch(e) { alert('ما قدرنا نسجل الدخول: ' + e.message); }
}
async function askNameIfNeeded(){
  if (!me || (members[me] && members[me].name)) return;
  const n = (prompt('اكتبي اسمك عشان يعرفك الجروب') || '').trim();
  if (n) await setDoc(doc(fdb, 'members', me), {name: n}, {merge: true});
}

/* ===== المزامنة ===== */
function startSync(){
  onSnapshot(doc(fdb, 'trip', 'plan'), async s => {
    if (s.exists()) plan = {...DEFAULT_PLAN, ...s.data()};
    else if (isOwner) await setDoc(doc(fdb, 'trip', 'plan'), DEFAULT_PLAN);
    render();
  });
  onSnapshot(doc(fdb, 'trip', 'budget'), async s => {
    if (s.exists()) budget = {...DEFAULT_BUDGET, ...s.data()};
    else if (isOwner) await setDoc(doc(fdb, 'trip', 'budget'), DEFAULT_BUDGET);
    render();
  });
  onSnapshot(collection(fdb, 'members'), s => {
    members = {};
    s.forEach(d => members[d.id] = d.data());
    render();
  });
}

onAuthStateChanged(auth, async u => {
  user = u;
  me = u ? u.uid : null;
  isOwner = !!(u && !u.isAnonymous && u.email === OWNER_EMAIL);
  if (!ready) { ready = true; startSync(); }
  render();
  if (me) await askNameIfNeeded();
});
ensureSignedIn();

/* ===== الوقت المتبقي ===== */
function tickCd(){
  const d = Math.max(0, TAKEOFF - Date.now());
  const days = Math.floor(d / 86400000), hrs = Math.floor(d / 3600000) % 24, mins = Math.floor(d / 60000) % 60, secs = Math.floor(d / 1000) % 60;
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = String(v).padStart(2, '0'); };
  set('cd-d', days); set('cd-h', hrs); set('cd-m', mins); set('cd-s', secs);
}
setInterval(tickCd, 1000);

function cityTags(c){
  const groups = [['activity','أنشطة'],['food','أكل'],['site','مواقع']];
  return groups.map(([k, label]) => {
    const list = (c.items || []).filter(i => i.kind === k);
    return list.length ? `<div style="margin-top:6px"><span class="hint">${label}</span><div class="tags">${list.map(i => `<span class="tag">${esc(i.text)}</span>`).join('')}</div></div>` : '';
  }).join('');
}

/* ===== الواجهات ===== */
const SCENE = `<svg class="scene" viewBox="0 0 360 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <circle cx="300" cy="34" r="20" fill="#F7D98B"/>
  <path d="M0 110 Q60 70 120 100 T250 92 T360 80 V150 H0Z" fill="#B9D9A6"/>
  <path d="M0 130 Q90 100 170 124 T360 116 V150 H0Z" fill="#9CC48C"/>
  <rect x="58" y="72" width="34" height="46" rx="3" fill="#F4B896"/><rect x="66" y="84" width="8" height="10" fill="#FFF"/><rect x="80" y="84" width="8" height="10" fill="#FFF"/>
  <rect x="98" y="62" width="30" height="56" rx="3" fill="#E8D5B0"/><rect x="105" y="74" width="7" height="9" fill="#FFF"/><rect x="117" y="74" width="7" height="9" fill="#FFF"/>
  <path d="M190 124 V84 Q190 62 212 62 Q234 62 234 84 V124Z" fill="#C9B8E8"/>
  <rect x="200" y="30" width="6" height="22" fill="#C9B8E8"/><path d="M203 24 L213 30 L203 36 Z" fill="#E8844A"/>
  <path d="M250 124 V76 L268 56 L286 76 V124Z" fill="#8EC5E8"/>
  <rect x="262" y="90" width="12" height="14" fill="#FFF"/>
  <ellipse cx="330" cy="110" rx="6" ry="20" fill="#3F7A52"/><ellipse cx="346" cy="112" rx="5" ry="16" fill="#3F7A52"/>
  <ellipse cx="22" cy="104" rx="6" ry="18" fill="#3F7A52"/>
</svg>`;

function viewHome(){
  const c = calc();
  const cityNow = plan.cities.find(x => x.id === plan.currentCity);
  const ups = (plan.updates || []).slice(0, 3);
  const mineContr = Number(mine().contributed || 0);
  const remaining = Math.max(0, c.share - mineContr);
  const tip = DEFAULT_TIPS[tipIdx % DEFAULT_TIPS.length];
  const ids = Object.keys(members);
  return `
  <section class="hero fade" aria-label="إيطاليا">
    ${SCENE}
    <div class="inner">
      <div class="top" style="margin-bottom:6px"><span class="pill">🇮🇹 إيطاليا · ١٤ يوم</span>${avatarStack(ids)}</div>
      <h1>Italy ✈️</h1>
      <p style="margin:6px 0 0;font-weight:700;font-size:16px">١٧ – ٢٩ أبريل ٢٠٢٧ · ٥ مسافرين</p>
      <div class="cd" role="timer" aria-label="الوقت المتبقي للإقلاع">
        <div><b id="cd-d">--</b><span>يوم</span></div>
        <div><b id="cd-h">--</b><span>ساعة</span></div>
        <div><b id="cd-m">--</b><span>دقيقة</span></div>
        <div><b id="cd-s">--</b><span>ثانية</span></div>
      </div>
    </div>
  </section>

  <section class="tip fade" aria-label="نصيحة للسفر">
    <div class="tipIcon" aria-hidden="true">${tip.icon}</div>
    <div class="grow"><div class="muted">نصيحة من ${esc(tip.city)}</div><p style="margin:4px 0 0;font-weight:700;font-size:16px;line-height:1.6">${esc(tip.text)}</p></div>
    <button class="btn sm" data-act="tip" aria-label="نصيحة ثانية">🎲</button>
  </section>

  <section class="share fade" aria-label="مبلغ المشاركة">
    <div>
      <small>مبلغ المشاركة</small>
      <strong>${fmt0(c.share)} <span style="font-size:18px">ريال</span></strong>
      <small>لكل مسافر، من الميزانية الكلية</small>
    </div>
    <div style="display:grid;gap:8px">
      <div class="mini"><span>دفعتِ</span><b>${fmt0(mineContr)}</b></div>
      <div class="mini"><span>باقي عليك</span><b>${fmt0(remaining)}</b></div>
    </div>
  </section>

  <section class="card fade"><h2>المساهمات 💰</h2>
    ${ids.length ? ids.map(id => {
      const m = members[id]; const pct = c.share ? Math.min(100, (Number(m.contributed || 0) / c.share) * 100) : 0;
      return `<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between;font-size:15px;margin-bottom:6px"><span style="font-weight:700">${esc(nameOf(id))}</span><span>${fmt(m.contributed)} ريال</span></div><div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div></div>`;
    }).join('') : '<p class="muted" style="margin:0">لسا ما أحد ضاف مساهمته. أضيفيها من تبويب مساهمتي ✈️</p>'}
  </section>

  ${c.available < 0 && isOwner ? '<div class="alert">⚠️ المصروف تجاوز الميزانية</div>' : ''}

  <section class="card fade"><h2>خط الرحلة 🗺️</h2>
    <div class="tl">
      ${plan.cities.map(x => `<div class="stop ${plan.currentCity === x.id ? 'now' : ''}" style="--c:${x.color}">
        <div class="row" style="justify-content:space-between"><strong style="font-size:18px">${esc(x.name)}</strong>${plan.currentCity === x.id ? '<span class="tag" style="background:#DCEEF9">أنتم هنا</span>' : ''}</div>
        <div class="muted">${esc(x.dates || 'التواريخ تتحدد لاحقاً')}</div>
      </div>`).join('')}
    </div>
    ${cityNow ? `<p class="muted" style="margin:6px 0 0">الحين في ${esc(cityNow.name)} · ${esc(cityNow.desc)}</p>` : ''}
  </section>

  <section class="card fade"><h2>آخر التحديثات 📣</h2>
    ${ups.length ? ups.map(u => `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><p style="margin:0;font-weight:600">${esc(u.text)}</p><span class="hint">${esc(new Date(u.at).toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'}))}</span></div>`).join('') : '<p class="muted" style="margin:0">ما فيه تحديثات لين الحين ✈️</p>'}
  </section>`;
}

function viewBudget(){
  const c = calc();
  const lines = budget.lines || [];
  const lineRow = l => `<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px;align-items:center">
      <button class="btn sm" data-act="booked" data-id="${esc(l.id)}" ${isOwner ? '' : 'disabled'} aria-pressed="${!!l.booked}" style="background:${l.booked ? '#A8D5B0' : '#EEF0F6'};color:${l.booked ? '#16331F' : '#5A6175'};min-width:92px">${l.booked ? 'تم الحجز ✓' : 'لم يُحجز'}</button>
      <button class="btn sm" data-act="paid" data-id="${esc(l.id)}" ${isOwner ? '' : 'disabled'} aria-pressed="${!!l.paid}" style="background:${l.paid ? '#A8D5B0' : '#F8D9D4'};color:${l.paid ? '#16331F' : '#8A2F26'};min-width:92px">${l.paid ? 'تم الدفع ✓' : 'لم يُدفع'}</button>
      <div style="flex:1 1 100%;font-weight:800;font-size:16px;line-height:1.5">${esc(l.label)}</div>
      ${isOwner ? `<input class="in" style="width:120px;height:44px" type="number" min="0" step="0.01" value="${Number(l.amount || 0)}" data-field="amount" data-id="${esc(l.id)}" aria-label="مبلغ ${esc(l.label)}">` : `<strong>${fmt(l.amount)}</strong>`}
    </div>`;
  return `<section class="card fade"><h2>الميزانية الكلية</h2>
    <label class="form"><span class="muted">المبلغ الكلي للرحلة (ريال) 🔒 مقفل</span>
      <input class="in" type="number" min="0" step="0.01" value="${Number(budget.total || 0)}" data-field="total" disabled style="font-size:22px;font-weight:800">
    </label>
    <p class="hint" style="margin:8px 0 0">مبلغ المشاركة للمسافر: ${fmt(c.share)} ريال</p>
  </section>
  <section class="card fade"><h2>السكن والتذاكر 🏨</h2>${lines.map(lineRow).join('') || '<p class="muted">لا توجد حجوزات</p>'}
    ${isOwner ? `<button class="btn primary" style="width:100%;margin-top:12px" data-act="addLine">+ إضافة حجز</button>` : ''}
  </section>
  <section class="card fade">
    <div class="row" style="justify-content:space-between;padding:6px 0"><span>الحجوزات المدفوعة</span><strong>${fmt(c.paid)}</strong></div>
    <div class="row" style="justify-content:space-between;padding:6px 0"><span>الحجوزات غير المدفوعة</span><strong>${fmt(c.unpaid)}</strong></div>
    ${isOwner ? `<div class="row" style="justify-content:space-between;padding:6px 0"><span>المصروفات</span><strong>${fmt(c.spent)}</strong></div>` : ''}
  </section>
  ${isOwner ? `<section class="share fade"><div><small>المتاح للصرف</small><strong style="font-size:38px">${fmt(c.available)} <span style="font-size:18px">ريال</span></strong></div></section>` : ''}
  ${isOwner && c.available < 0 ? '<div class="alert">⚠️ المصروف تجاوز الميزانية</div>' : ''}`;
}

function viewMine(){
  const m = mine();
  const exps = (m.expenses || []).filter(e => catFilter === 'الكل' || e.cat === catFilter);
  const share = calc().share;
  const left = share - Number(m.contributed || 0);
  return `<section class="card fade"><h2>مساهمتي 💳</h2>
    <div class="share" style="margin-bottom:14px;flex-direction:column;align-items:flex-start"><div><small>مبلغ المشاركة (ثابت)</small><strong>${fmt0(share)} <span style="font-size:18px">ريال</span></strong></div></div>
    <p class="muted" style="margin:0 0 6px">كم دفعتِ لحد الحين</p>
    <div class="row"><input class="in" type="number" min="0" step="0.01" id="contrib" value="${Number(m.contributed || 0)}" aria-label="مبلغ مساهمتي" ${me ? '' : 'disabled'}><button class="btn primary" data-act="saveContrib" ${me ? '' : 'disabled'}>حفظ</button></div>
    <div class="row" style="justify-content:space-between;margin-top:12px"><span class="muted">باقي عليك</span><strong style="color:${left < 0 ? 'var(--red)' : 'var(--green)'}">${fmt(left)} ريال</strong></div>
  </section>
  <section class="card fade"><h2>مصروف جديد ✍️</h2>
    <form class="form" id="expForm">
      <input class="in" name="amount" type="number" min="0" step="0.01" placeholder="المبلغ (ريال)" required>
      <div class="two">
        <select class="sel" name="cat">${CATS.map(c => `<option>${c}</option>`).join('')}</select>
        <select class="sel" name="city">${plan.cities.map(c => `<option>${esc(c.name)}</option>`).join('')}</select>
      </div>
      <input class="in" name="note" placeholder="ملاحظة، مثلاً: عشاء بيتزا">
      <button class="btn ink" type="submit" ${me ? '' : 'disabled'}>أضيفي المصروف</button>
    </form>
  </section>
  <div class="chips" role="group" aria-label="فلترة حسب القسم">${['الكل', ...CATS].map(c => `<button class="chip" aria-pressed="${catFilter === c}" data-act="filter" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  ${exps.length ? exps.slice().reverse().map(e => `<div class="exp fade" style="--c:${CAT_COLOR[e.cat] || '#ccc'}">
      <div class="grow"><div style="font-weight:700;font-size:17px">${esc(e.note || e.cat)}</div><div class="muted">${esc(e.cat)} · ${esc(e.city)}</div></div>
      <strong style="white-space:nowrap">${fmt(e.amount)} <span style="font-size:13px">ريال</span></strong>
      <button class="del" aria-label="حذف المصروف" data-act="delExp" data-id="${esc(e.id)}">🗑️</button>
    </div>`).join('') : `<div class="empty fade"><div style="font-size:34px" aria-hidden="true">✈️🧳</div><p style="font-weight:800;font-size:18px;margin:8px 0 4px">شنطتك جاهزة؟ 🧳 الرحلة قريبة!</p><p class="muted" style="margin:0">أول مصروف تسجلينه بيبدأ معنا العد الحقيقي لإيطاليا، يلا نبدأ 🇮🇹🍕</p></div>`}`;
}

function viewRoute(){
  return `
  <h2 style="padding-right:4px">خط الرحلة 🗺️</h2>
  <div style="position:relative;margin-right:46px">
    <div aria-hidden="true" style="position:absolute;top:10px;bottom:10px;right:-30px;border-right:3px dashed #B9AFA0"></div>
    ${plan.cities.map(c => `<article class="city fade" style="--c:${c.color}">
      <span class="dot" aria-hidden="true">${plan.currentCity === c.id ? '✈️' : '📍'}</span>
      <div class="row" style="justify-content:space-between"><h3>${esc(c.name)}</h3>${plan.currentCity === c.id ? '<span class="tag" style="background:#DCEEF9">أنتم هنا</span>' : ''}</div>
      <p class="muted" style="margin:4px 0 0">${esc(c.dates || 'التواريخ تتحدد لاحقاً')}</p>
      <p style="margin:6px 0 0">${esc(c.desc)}</p>
      ${cityTags(c) || '<p class="hint" style="margin:8px 0 0">المقترحات تنضاف قريب</p>'}
      ${isOwner ? `<div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn sm" data-act="setCity" data-id="${c.id}">تحديد كمدينة حالية</button><button class="btn sm" data-act="cityDates" data-id="${c.id}">تعديل التواريخ</button></div>` : ''}
    </article>`).join('')}
  </div>
  ${isOwner ? `<section class="card fade"><h2>إضافة اقتراح ✨</h2>
    <form class="form" id="sugForm">
      <div class="two"><select class="sel" name="city">${plan.cities.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      <select class="sel" name="kind"><option value="activity">نشاط</option><option value="food">أكل</option><option value="site">موقع</option></select></div>
      <input class="in" name="text" placeholder="مثلاً: كاتدرائية الدومو" required>
      <button class="btn ink" type="submit">أضيفيه للمدينة</button>
    </form>
    <form class="form" id="updForm" style="margin-top:16px">
      <textarea class="ta" name="text" placeholder="تحديث للمسافرين، مثلاً: الحجز تأكد ✅" required></textarea>
      <button class="btn primary" type="submit">انشري التحديث</button>
    </form>
  </section>` : '<p class="hint" style="text-align:center">المقترحات والخطة تحددها صاحبة الرحلة</p>'}`;
}

function viewBag(){
  const m = mine();
  const items = (m.bag && m.bag.length) ? m.bag : DEFAULT_BAG.map((t, i) => ({id: 'd' + i, t, done: false}));
  const done = items.filter(i => i.done).length;
  const pct = items.length ? Math.round((done / items.length) * 100) : 0;
  return `
  <section class="card fade" style="display:flex;align-items:center;gap:16px">
    <div class="ring" aria-hidden="true" style="background:conic-gradient(var(--olive) 0 ${pct * 3.6}deg,#EFE9E1 ${pct * 3.6}deg 360deg)"><div><div><b style="font-size:24px">${pct}%</b><div class="muted">${done} من ${items.length}</div></div></div></div>
    <div><h2 style="margin:0">تجهيز الحقيبة 🧳</h2><p class="muted" style="margin:6px 0 0;line-height:1.6">كل ما تعلّمين عنصر، الدائرة تتحدث ✈️</p></div>
  </section>
  <section class="card fade" style="padding:6px 18px">${items.map(i => `<label class="ck" style="border-bottom:1px solid var(--line)"><input type="checkbox" ${i.done ? 'checked' : ''} data-act="bag" data-id="${esc(i.id)}"><span class="grow">${esc(i.t)}</span></label>`).join('')}</section>
  <form class="row fade" id="bagForm"><input class="in" name="t" placeholder="أضيفي عنصر جديد…" ${me ? '' : 'disabled'}><button class="btn primary" type="submit" ${me ? '' : 'disabled'}>إضافة</button></form>`;
}

const VIEWS = {home: viewHome, budget: viewBudget, mine: viewMine, route: viewRoute, bag: viewBag};
const TABS = [['home','🏠','الرئيسية'],['budget','💰','المجموع'],['mine','🧾','مساهمتي'],['route','🗺️','الخط'],['bag','🧳','الحقيبة']];

function loginBar(){
  if (isOwner) return '<span class="pill">🔑 المالكة</span>';
  return '<button class="btn sm" data-act="login">🔑 دخول المالكة</button>';
}

function render(){
  const app = $('#app');
  if (!app) return;
  const focusKey = document.activeElement && document.activeElement.id;
  const view = VIEWS[tab]();
  app.innerHTML = view;
  const top = app.querySelector('.hero .top');
  if (top) top.insertAdjacentHTML('beforeend', '');
  $('#nav').innerHTML = TABS.map(([k, i, l]) => `<button data-act="tab" data-v="${k}" aria-current="${tab === k ? 'page' : 'false'}"><span class="i" aria-hidden="true">${i}</span>${l}</button>`).join('');
  const hero = app.querySelector('.hero');
  if (hero) hero.insertAdjacentHTML('afterbegin', `<div style="position:absolute;top:14px;left:14px;z-index:2">${loginBar()}</div>`);
  tickCd();
  if (focusKey) { const el = document.getElementById(focusKey); if (el) el.focus(); }
}

/* ===== الأحداث ===== */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  if (a === 'login') { await ownerLogin(); return; }
  if (a === 'tab') { tab = v; render(); window.scrollTo({top: 0, behavior: 'smooth'}); return; }
  if (a === 'tip') { tipIdx = Math.floor(Math.random() * DEFAULT_TIPS.length); render(); return; }
  if (a === 'filter') { catFilter = v; render(); return; }
  if (a === 'delExp' && me) { const next = (mine().expenses || []).filter(x => x.id !== id); await saveMine({expenses: next}); return; }
  if (a === 'booked' && isOwner) { budget.lines = budget.lines.map(l => l.id === id ? {...l, booked: !l.booked} : l); await saveBudget(); return; }
  if (a === 'paid' && isOwner) { budget.lines = budget.lines.map(l => l.id === id ? {...l, paid: !l.paid} : l); await saveBudget(); return; }
  if (a === 'addLine' && isOwner) { const label = prompt('اسم الحجز'); if (!label) return; const amount = Number(prompt('المبلغ (ريال)', '0')) || 0; budget.lines = [...budget.lines, {id: uid(), group: 'tickets', label, amount, paid: false}]; await saveBudget(); return; }
  if (a === 'bag' && me) { const cur = (mine().bag && mine().bag.length) ? mine().bag : DEFAULT_BAG.map((t, i) => ({id: 'd' + i, t, done: false})); const next = cur.map(i => i.id === id ? {...i, done: !i.done} : i); await saveMine({bag: next}); return; }
  if (a === 'setCity' && isOwner) { plan.currentCity = id; await savePlan(); return; }
  if (a === 'cityDates' && isOwner) { const c = plan.cities.find(x => x.id === id); const d = prompt('التواريخ لهذي المدينة', c.dates || ''); if (d === null) return; c.dates = d; await savePlan(); return; }
  if (a === 'saveContrib') { const n = Number(($('#contrib') || {}).value) || 0; await saveMine({contributed: n}); return; }
});

document.addEventListener('change', async e => {
  const f = e.target.dataset.field;
  if (!f) return;
  const v = Number(e.target.value) || 0;
  if (f === 'total' && isOwner) { budget.total = v; await saveBudget(); }
  if (f === 'amount' && isOwner) { const id = e.target.dataset.id; budget.lines = budget.lines.map(l => l.id === id ? {...l, amount: v} : l); await saveBudget(); }
});

document.addEventListener('submit', async e => {
  const form = e.target;
  if (form.id === 'expForm') {
    e.preventDefault();
    const fd = new FormData(form);
    const amount = Number(fd.get('amount')) || 0;
    if (!amount || !me) return;
    const exp = {id: uid(), amount, cat: fd.get('cat'), city: fd.get('city'), note: String(fd.get('note') || '').trim(), at: Date.now()};
    await saveMine({expenses: [...(mine().expenses || []), exp]});
    form.reset();
  }
  if (form.id === 'bagForm') {
    e.preventDefault();
    const t = String(new FormData(form).get('t') || '').trim();
    if (!t || !me) return;
    const cur = (mine().bag && mine().bag.length) ? mine().bag : DEFAULT_BAG.map((x, i) => ({id: 'd' + i, t: x, done: false}));
    await saveMine({bag: [...cur, {id: uid(), t, done: false}]});
    form.reset();
  }
  if (form.id === 'sugForm' && isOwner) {
    e.preventDefault();
    const fd = new FormData(form);
    const c = plan.cities.find(x => x.id === fd.get('city'));
    if (!c) return;
    c.items = [...(c.items || []), {id: uid(), kind: fd.get('kind'), text: String(fd.get('text') || '').trim()}];
    form.reset(); await savePlan();
  }
  if (form.id === 'updForm' && isOwner) {
    e.preventDefault();
    const text = String(new FormData(form).get('text') || '').trim();
    if (!text) return;
    plan.updates = [{text, at: Date.now()}, ...(plan.updates || [])];
    form.reset(); await savePlan();
  }
});

render();
</script>
</body>
</html>

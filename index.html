function calc(){
  const lines = budget.lines || [];
  const committed = sum(lines);
  const paid = sum(lines.filter(l => l.paid));
  const unpaid = committed - paid;
  const spent = sum(Object.values(members).flatMap(m => m.expenses || []));
  const pool = Object.values(members).reduce((s, m) => s + Number(m.contributed || 0), 0);
  const available = Number(budget.total || 0) - spent - committed;
  const share = Number(budget.total || 0) / Math.max(1, Number(plan.travelers || 5));
  return {committed, paid, unpaid, spent, pool, available, share};
}

function tickCd(){
  const nowT = Date.now();
  const toReturn = nowT >= TAKEOFF;
  const d = Math.max(0, (toReturn ? RETURN : TAKEOFF) - nowT);
  const lbl = document.getElementById('cd-label');
  if (lbl) lbl.textContent = nowT >= RETURN ? 'رجعتوا بالسلامة 🏠' : toReturn ? 'باقي على الرجعة للسعودية 🏠' : 'باقي على الإقلاع ✈️';
  const days = Math.floor(d / 86400000), hrs = Math.floor(d / 3600000) % 24, mins = Math.floor(d / 60000) % 60, secs = Math.floor(d / 1000) % 60;
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = String(v).padStart(2, '0'); };
  set('cd-d', days); set('cd-h', hrs); set('cd-m', mins); set('cd-s', secs);
  const fmtT = tz => { const p = new Intl.DateTimeFormat('en-US', {timeZone: tz, hour: 'numeric', minute: '2-digit', hour12: true}).formatToParts(new Date()); const g = t => (p.find(x => x.type === t) || {}).value || ''; return `${g('hour')}:${g('minute')} ${g('dayPeriod') === 'AM' ? 'ص' : 'م'}`; };
  const showClock = (id, tz, key) => {
    const el = document.getElementById(id); if (!el) return;
    const hr = Number(new Intl.DateTimeFormat('en-US', {timeZone: tz, hour: 'numeric', hour12: false}).format(new Date()));
    el.setAttribute('data-ic', iconFor(key, tz, hr));
    el.textContent = clockMode[key] ? new Intl.DateTimeFormat('ar-SA', {timeZone: tz, weekday: 'long', day: 'numeric', month: 'long'}).format(new Date()) : fmtT(tz);
  };
  showClock('clk-sa', 'Asia/Riyadh', 'sa');
  showClock('clk-it', 'Europe/Rome', 'it');
}

}

/* ---------- currency converter (EUR <-> SAR) ---------- */
const FX_KEY = 'italyTripFxRate';
const fxRate = () => { const r = Number(localStorage.getItem(FX_KEY)); return r > 0 ? r : 4.3; };
function fxText(amt, rate, dir){
  if (!rate) return 'أدخلي سعر الصرف';
  const res = dir === 'sarEur' ? amt / rate : amt * rate;
  const unit = dir === 'sarEur' ? '€' : 'ريال';
  return `<strong>${res.toLocaleString('en-US', {maximumFractionDigits: 2})}</strong> ${unit}`;
}
function fxCard(){
  const r = fxRate();
  return `<section class="card fade"><h2>محول العملة 💱</h2>
    <div class="row" style="flex-wrap:wrap;gap:10px">
      <input class="in" id="fxAmt" type="number" min="0" step="0.01" value="100" data-fx="amt" aria-label="المبلغ" style="flex:1;min-width:120px">
      <select class="in" id="fxDir" data-fx="dir" aria-label="اتجاه التحويل" style="flex:1;min-width:140px">
        <option value="eurSar">يورو ← ريال</option>
        <option value="sarEur">ريال ← يورو</option>
      </select>
    </div>
    <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:10px;align-items:center">
      <span class="muted">سعر الصرف: 1 يورو =</span>
      <input class="in" id="fxRate" type="number" min="0" step="0.01" value="${r}" data-fx="rate" aria-label="سعر الصرف" style="width:110px">
      <span class="muted">ريال</span>
    </div>
    <div class="fx-out" id="fxOut">${fxText(100, r, 'eurSar')}</div>
    <p class="hint" style="margin:8px 0 0">عدّلي سعر الصرف حسب سعر اليوم، ويُحفظ على جهازك.</p>
  </section>`;
}
function updateFx(){
  const amt = Number(($('#fxAmt') || {}).value) || 0;
  const rate = Number(($('#fxRate') || {}).value) || 0;
  const dir = ($('#fxDir') || {}).value || 'eurSar';
  const out = $('#fxOut');
  if (out) out.innerHTML = fxText(amt, rate, dir);
}
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.fx;
  if (!f) return;
  if (f === 'rate') { const r = Number(e.target.value); if (r > 0) { try { localStorage.setItem(FX_KEY, String(r)); } catch(_) {} } }
  updateFx();
});
document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.fx) updateFx(); });
